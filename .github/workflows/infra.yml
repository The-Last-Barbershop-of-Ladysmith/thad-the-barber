# Compiles and lints the Bicep in infra/, then previews the nonprod deployment with what-if (issue #9).
# reports.bicep (#137) is built and linted only: it creates Entra objects, which what-if doesn't support.
# What-if signs in with OIDC as the read-only preview identity (issue #10), set up by infra/scripts/Set-TtbGitHub.ps1.
# It's skipped until the AZURE_PREVIEW_CLIENT_ID variable exists, and on fork PRs (no OIDC token, no secrets).
name: infra

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'

permissions:
  contents: read

jobs:
  bicep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and lint
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep lint --file infra/main.bicep
          az bicep build-params --file infra/nonprod.bicepparam --stdout > /dev/null
          az bicep build --file infra/reports.bicep --stdout > /dev/null
          az bicep lint --file infra/reports.bicep
          az bicep build-params --file infra/reports.bicepparam --stdout > /dev/null
        env:
          TTB_ALERT_EMAIL: ci@example.invalid
          TTB_ADMIN_OBJECT_ID: 00000000-0000-0000-0000-000000000000

  what-if:
    needs: bicep
    if: vars.AZURE_PREVIEW_CLIENT_ID != '' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_PREVIEW_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The personal values are secrets so the public logs mask them. GitHub masks a secret only as a whole
      # string, so each IP in the list is masked on its own too. ProviderNoRbac checks read access only,
      # which is all the preview identity has.
      - name: What-if (nonprod)
        run: |
          for ip in ${TTB_ALLOWED_IPS//,/ }; do echo "::add-mask::${ip%/32}"; done
          az deployment sub what-if \
            --location centralus \
            --validation-level ProviderNoRbac \
            --parameters infra/nonprod.bicepparam
        env:
          TTB_ALERT_EMAIL: ${{ secrets.TTB_ALERT_EMAIL }}
          TTB_ALERT_PHONE: ${{ secrets.TTB_ALERT_PHONE }}
          TTB_ADMIN_OBJECT_ID: ${{ secrets.TTB_ADMIN_OBJECT_ID }}
          TTB_ALLOWED_IPS: ${{ secrets.TTB_ALLOWED_IPS }}
