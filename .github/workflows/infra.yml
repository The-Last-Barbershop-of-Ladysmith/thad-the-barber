# Compiles and lints the Bicep in infra/, then previews the nonprod deployment with what-if (issue #9).
# The what-if job runs once the OIDC login from issue #10 exists (repo variables AZURE_CLIENT_ID,
# AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID and TTB_BUDGET_EMAIL); until then it is skipped.
name: infra

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'

permissions:
  contents: read

jobs:
  bicep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Build and lint
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep lint --file infra/main.bicep
          az bicep build-params --file infra/nonprod.bicepparam --stdout > /dev/null
        env:
          TTB_BUDGET_EMAIL: ci@example.invalid

  what-if:
    needs: bicep
    if: vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: What-if (nonprod)
        run: |
          az deployment sub what-if \
            --location eastus \
            --parameters infra/nonprod.bicepparam
        env:
          TTB_BUDGET_EMAIL: ${{ vars.TTB_BUDGET_EMAIL }}
          TTB_ADMIN_OBJECT_ID: ${{ vars.TTB_ADMIN_OBJECT_ID }}
          TTB_DEPLOY_PRINCIPAL_ID: ${{ vars.TTB_DEPLOY_PRINCIPAL_ID }}
          TTB_ALLOWED_IPS: ${{ vars.TTB_ALLOWED_IPS }}
