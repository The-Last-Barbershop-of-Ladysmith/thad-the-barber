# Pull-request checks (issue #15). The job names are the required checks listed in the REQUIRED_CHECKS repo
# variable, which the merge-policy alert (#3) reads, so rename a job only together with that variable.
name: ci

on:
  pull_request:
    branches:
      - 'dev/**'
      - 'release/**'
      - 'hotfix/**'
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Scans only the PR's commits. .gitleaks.toml extends the default rules.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tarball"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $tarball\$" | sha256sum -c -
          tar -xzf "$tarball" gitleaks

      - name: Scan the PR's commits
        run: ./gitleaks git --redact --verbose --log-opts="${BASE_SHA}..${HEAD_SHA}"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: thad-the-barber-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            thad-the-barber-ui/package-lock.json
            thad-the-barber-express/package-lock.json

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npx ng test --watch=false
      - run: npm run build

      - run: npm ci
        working-directory: thad-the-barber-express
      - run: npm audit --audit-level=high
        working-directory: thad-the-barber-express
      - run: npm test
        working-directory: thad-the-barber-express

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet build thad-the-barber-api/thad-the-barber-api.sln
      - run: dotnet test --solution thad-the-barber-api/thad-the-barber-api.sln --no-build

      # Microsoft's coverage extension can't fail a run below a threshold, so the gate reads the Cobertura root.
      - name: Line coverage at least 80%
        run: |
          python3 - <<'EOF'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse('thad-the-barber-api.tests/TestResults/coverage.cobertura.xml').getroot()
          line, branch = float(root.get('line-rate')), float(root.get('branch-rate'))
          passed = line >= 0.8
          with open('coverage-summary.md', 'w') as summary:
              summary.write('### API coverage\n\n| Lines | Branches |\n| --- | --- |\n')
              summary.write(f"| {'✅' if passed else '❌'} {line:.1%} (min 80%) | {branch:.1%} |\n")
          print(f'Line coverage: {line:.1%}, branch coverage: {branch:.1%}')
          sys.exit(0 if passed else 'Line coverage is below 80%')
          EOF

      - name: Job summary
        if: ${{ !cancelled() }}
        run: cat coverage-summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: summary-api
          path: coverage-summary.md
          if-no-files-found: ignore

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: api-coverage
          path: thad-the-barber-api.tests/TestResults/coverage.cobertura.xml

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: thad-the-barber-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            thad-the-barber-ui/package-lock.json
            thad-the-barber-express/package-lock.json

      - run: npm ci
      - run: npm ci --omit=dev
        working-directory: thad-the-barber-express

      - name: Playwright version
        id: playwright
        run: echo "version=$(npx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # The cache holds the browsers only; their system libraries are installed on every run.
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      - run: npm run e2e

      - name: Summarize
        if: ${{ !cancelled() }}
        run: npm run e2e:summary

      - name: Job summary
        if: ${{ !cancelled() }}
        run: cat test-results/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: summary-e2e
          path: thad-the-barber-ui/test-results/summary.md
          if-no-files-found: ignore

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: |
            thad-the-barber-ui/playwright-report/
            thad-the-barber-ui/test-results/

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: thad-the-barber-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            thad-the-barber-ui/package-lock.json
            thad-the-barber-express/package-lock.json

      - run: npm ci
      - run: npm ci --omit=dev
        working-directory: thad-the-barber-express

      # Scores what deploys: the optimized build served by Express. NOINDEX=false sends prod's headers, since the
      # noindex that dev and test send would fail the SEO category.
      - run: npm run build:express:test

      - name: Start the site
        run: |
          PORT=4200 NOINDEX=false npm --prefix ../thad-the-barber-express start > serve.log 2>&1 &
          timeout 60 bash -c 'until curl -sf http://localhost:4200 > /dev/null; do sleep 2; done' || { cat serve.log; exit 1; }

      # Mobile emulation, Lighthouse's default. Uses the runner's preinstalled Chrome.
      - name: Lighthouse
        run: |
          mkdir -p lighthouse-results
          for page in home:/ book:/book; do
            npx lighthouse "http://localhost:4200${page#*:}" \
              --quiet \
              --chrome-flags="--headless=new --no-sandbox" \
              --only-categories=performance,accessibility,best-practices,seo \
              --output=json --output=html \
              --output-path="lighthouse-results/${page%%:*}"
          done

      - run: npm run lighthouse:check

      - name: Job summary
        if: ${{ !cancelled() }}
        run: cat lighthouse-results/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: summary-lighthouse
          path: thad-the-barber-ui/lighthouse-results/summary.md
          if-no-files-found: ignore

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-reports
          path: thad-the-barber-ui/lighthouse-results/

  # One comment per PR, updated on every run. Skipped on fork and Dependabot PRs, whose token can't comment.
  report:
    needs:
      - gitleaks
      - ui
      - api
      - e2e
      - lighthouse
    if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: summary-*
          path: summaries

      - name: Build the comment
        run: |
          {
            echo '<!-- ci-report -->'
            echo "## CI for ${HEAD_SHA::7}"
            echo
            echo '| Check | Result |'
            echo '| --- | --- |'
            jq -r 'to_entries[] | "| `\(.key)` | \(if .value.result == "success" then "✅" elif .value.result == "skipped" then "⏭️" else "❌" end) \(.value.result) |"' <<< "$NEEDS"
            for job in api e2e lighthouse; do
              file=$(find "summaries/summary-$job" -name '*.md' 2>/dev/null | head -n 1)
              if [[ -n "$file" ]]; then echo; cat "$file"; fi
            done
            echo
            echo "[Run details and reports]($RUN_URL)"
          } > comment.md
        env:
          NEEDS: ${{ toJSON(needs) }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Post or update the comment
        run: |
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq '.[] | select(.body | startswith("<!-- ci-report -->")) | .id' | head -n 1)
          if [[ -n "$id" ]]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@comment.md > /dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -F body=@comment.md > /dev/null
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
