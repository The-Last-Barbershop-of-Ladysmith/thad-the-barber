# Unit tests for the merge-policy rules and a lint of every workflow file (issue #3).
name: policy-tests

on:
  pull_request:
    paths:
      - '.github/**'

permissions:
  contents: read

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Policy rule tests
        working-directory: .github/policy
        run: npm test

      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
