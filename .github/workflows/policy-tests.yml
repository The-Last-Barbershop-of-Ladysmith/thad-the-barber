# Unit tests for the merge-policy rules (issue #3), plus the workflow hardening check (#18) and actionlint.
name: policy-tests

on:
  pull_request:
    paths:
      - '.github/**'

permissions:
  contents: read

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Policy rule tests
        working-directory: .github/policy
        run: npm test

      - name: Workflow hardening (SHA-pinned actions, permissions, no pull_request_target)
        working-directory: .github/policy
        run: npm run workflows

      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
