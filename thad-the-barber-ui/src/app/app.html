@if (isNavigating()) {
  <p-progressbar class="page-loading" mode="indeterminate" aria-label="Loading page" />
}
<app-header />
<main class="relative">
  <router-outlet />
</main>
<app-footer />
<p-toast
  position="bottom-right"
  [life]="4000"
  [breakpoints]="toastBreakpoints"
  preventOpenDuplicates
/>
