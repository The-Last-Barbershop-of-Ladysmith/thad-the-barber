<a
  class="skip-link"
  data-testid="skip-link"
  href="#main-content"
  (click)="skipToContent($event, mainContent)"
  >Skip to content</a
>
@if (isNavigating()) {
  <div class="page-loading" aria-hidden="true">
    <p-progressbar mode="indeterminate" />
  </div>
}
<div class="app-shell">
  @if (!isAdminArea()) {
    <app-header />
  }
  <main id="main-content" #mainContent tabindex="-1" class="main-content relative">
    <router-outlet />
  </main>
  @if (!isAdminArea()) {
    <app-footer />
  }
</div>
<p-toast
  position="bottom-right"
  [life]="4000"
  [breakpoints]="toastBreakpoints"
  preventOpenDuplicates
/>
