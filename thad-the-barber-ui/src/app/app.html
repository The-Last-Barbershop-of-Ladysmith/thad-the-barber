<a
  class="skip-link"
  data-testid="skip-link"
  href="#main-content"
  (click)="skipToContent($event, mainContent)"
  >Skip to content</a
>
@if (isNavigating()) {
  <p-progressbar class="page-loading" mode="indeterminate" aria-label="Loading page" />
}
<app-header />
<main id="main-content" #mainContent tabindex="-1" class="main-content relative">
  <router-outlet />
</main>
<app-footer />
<p-toast
  position="bottom-right"
  [life]="4000"
  [breakpoints]="toastBreakpoints"
  preventOpenDuplicates
/>
