<div class="top" data-site-top>
  <app-announcement-strip />
  <header class="bar site-gutter py-2.5 md:py-3.5">
    <a routerLink="/" class="home-link" (click)="closeMenu()">
      <img src="assets/logo.png" [alt]="shopName()" class="logo h-9 md:h-11" />
    </a>

    @if (onBookingPage()) {
      <a routerLink="/" class="nav-link bar-link back-link">
        <i class="pi pi-arrow-left text-sm"></i> Back to site
      </a>
    } @else {
      <nav class="section-nav hidden lg:flex" aria-label="Page sections" data-testid="header-nav">
        @for (item of sections(); track item.fragment) {
          <a routerLink="/" [fragment]="item.fragment" class="nav-link bar-link">{{ item.label }}</a>
        }
      </nav>
      <div class="actions hidden lg:flex">
        <a [href]="phone().tel" class="nav-link phone-link hidden xl:flex" data-testid="header-phone">
          <i class="pi pi-phone"></i>
          {{ phone().display }}
        </a>
        <a pButton size="small" routerLink="/book" data-testid="header-book">Book a cut</a>
      </div>
      <button
        pButton
        type="button"
        severity="secondary"
        [rounded]="true"
        [iconOnly]="true"
        class="menu-toggle lg:hidden"
        data-testid="menu-toggle"
        aria-label="Open menu"
        [attr.aria-expanded]="menuOpen()"
        (click)="toggleMenu()"
      >
        <i class="pi pi-bars"></i>
      </button>
    }
  </header>
  <app-offline-banner />
</div>

<p-drawer
  position="right"
  [visible]="menuOpen()"
  (visibleChange)="$event || closeMenu()"
  [blockScroll]="true"
  ariaCloseLabel="Close menu"
  styleClass="w-[min(20rem,85vw)]"
>
  <nav class="stack gap-1" aria-label="Page sections" data-testid="drawer-nav">
    @for (item of sections(); track item.fragment) {
      <a
        routerLink="/"
        [fragment]="item.fragment"
        class="nav-link drawer-link"
        (click)="closeMenu()"
        >{{ item.label }}</a
      >
    }
  </nav>
  <div class="stack mt-8 gap-3">
    <a pButton routerLink="/book" [fluid]="true" (click)="closeMenu()">
      Book a cut
      <i class="pi pi-arrow-right"></i>
    </a>
    <a pButton [outlined]="true" [fluid]="true" [href]="phone().tel">
      {{ phone().display }}
    </a>
  </div>
</p-drawer>
