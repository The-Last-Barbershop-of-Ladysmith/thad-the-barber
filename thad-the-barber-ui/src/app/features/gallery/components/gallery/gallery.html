<section class="gallery site-gutter site-section" data-testid="gallery">
  <div class="inner">
    <app-section-heading eyebrow="Lookbook" title="Fresh out the chair" />

    @if (photos().length > 0) {
      <ul class="prints">
        @for (photo of photos(); track photo.src; let i = $index) {
          <li class="print">
            <button
              #opener
              type="button"
              class="print-button"
              [attr.aria-label]="'Open ' + photo.alt"
              (click)="open(i, opener)"
            >
              <img [src]="photo.src" [alt]="photo.alt" loading="lazy" class="print-img" />
            </button>
          </li>
        }
      </ul>
    } @else if (isLoading()) {
      <div class="prints-loading" data-testid="gallery-loading">
        <p-skeleton width="100%" height="100%" />
      </div>
    } @else {
      <p class="empty body-copy" data-testid="gallery-empty">No photos to show right now. Check back soon.</p>
    }
  </div>
</section>

@if (lightboxOpen()) {
  @defer (on immediate) {
    <app-gallery-lightbox
      [photos]="photos()"
      [(activeIndex)]="activeIndex"
      (closed)="closeLightbox()"
    />
  }
}
