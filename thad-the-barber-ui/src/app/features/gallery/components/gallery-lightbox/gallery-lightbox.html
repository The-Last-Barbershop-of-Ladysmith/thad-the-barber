<p-gallery
  #lightbox
  pFocusTrap
  class="lightbox"
  role="dialog"
  aria-modal="true"
  aria-label="Photo viewer"
  [fullscreen]="true"
  [(activeIndex)]="activeIndex"
  (onFullscreenChange)="$event || closed.emit()"
>
  <p-gallery-backdrop />
  <p-gallery-header class="lightbox-header">
    <button pGalleryFullScreen type="button" aria-label="Close">
      <i class="pi pi-times"></i>
    </button>
  </p-gallery-header>
  <p-gallery-content>
    @for (photo of photos(); track photo.src) {
      <p-gallery-item>
        <img [src]="photo.src" [alt]="photo.alt" class="lightbox-img" loading="lazy" />
      </p-gallery-item>
    }
    <button pGalleryPrev type="button" aria-label="Previous photo">
      <i class="pi pi-chevron-left"></i>
    </button>
    <button pGalleryNext type="button" data-testid="lightbox-next" aria-label="Next photo">
      <i class="pi pi-chevron-right"></i>
    </button>
  </p-gallery-content>
  <p-gallery-footer>
    <span class="lightbox-count" aria-live="polite">
      <span aria-hidden="true" data-testid="lightbox-count">{{ activeIndex() + 1 }} / {{ photos().length }}</span>
      <span class="sr-only" data-testid="lightbox-count-label">Photo {{ activeIndex() + 1 }} of {{ photos().length }}</span>
    </span>
  </p-gallery-footer>
</p-gallery>
