<app-admin-styles />
<div class="admin">
  <aside class="side" aria-label="Admin">
    <app-admin-menu />
  </aside>

  <header class="topbar">
    <a routerLink="/admin/overview" class="topbar-brand">
      <img class="logo" src="assets/logo.png" width="480" height="212" alt="Thad the Barber" />
      <span class="brand-tag">Admin</span>
    </a>
    <button
      pButton
      type="button"
      severity="secondary"
      [outlined]="true"
      [iconOnly]="true"
      aria-label="Open the menu"
      data-testid="admin-menu-toggle"
      [attr.aria-expanded]="isMenuOpen()"
      (click)="isMenuOpen.set(true)"
    >
      <i class="pi pi-bars" aria-hidden="true"></i>
    </button>
  </header>

  <div class="content">
    <router-outlet />
  </div>
</div>

<p-drawer
  [visible]="isMenuOpen()"
  (visibleChange)="isMenuOpen.set($event)"
  [fullScreen]="true"
  [blockScroll]="true"
  ariaCloseLabel="Close the menu"
  [pt]="drawerPt"
>
  <app-admin-menu (navigated)="isMenuOpen.set(false)" />
</p-drawer>
