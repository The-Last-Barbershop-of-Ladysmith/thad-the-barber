<button type="button" class="nav-link" data-testid="text-updates-open" (click)="isOpen.set(true)">
  Text updates
</button>
@defer (when isOpen()) {
  <p-dialog
    header="Shop news by text"
    [modal]="true"
    [draggable]="false"
    [dismissableMask]="true"
    [(visible)]="isOpen"
  >
    <app-text-updates-form idPrefix="text-updates-dialog" />
  </p-dialog>
}
