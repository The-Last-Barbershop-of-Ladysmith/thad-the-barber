<app-backdrop mode="still" [still]="5" />

<div class="booking-page">
  <header class="stack gap-2">
    <span class="eyebrow">Book an appointment</span>
    <h1 class="section-title">Schedule your cut</h1>
  </header>

  @if (savedBookingNotice(); as savedNotice) {
    <app-notice-message data-testid="saved-booking" [notice]="savedNotice" />
  }
  @if (availabilityNotice(); as loadFailureNotice) {
    <app-notice-message [notice]="loadFailureNotice" (retry)="reloadMonth()" />
  }

  <form
    class="steps-and-summary lg:grid-cols-[minmax(0,1fr)_minmax(0,24rem)]"
    [formGroup]="bookingForm"
    (ngSubmit)="confirm()"
  >
    <div class="stack gap-8">
      <app-date-step
        [dateControl]="bookingForm.controls.date"
        [startAtControl]="bookingForm.controls.startAt"
      />
      <app-time-step
        [startAtControl]="bookingForm.controls.startAt"
        [selectedDate]="bookingFormValue().date"
      />
      <app-details-step
        [nameControl]="bookingForm.controls.name"
        [phoneControl]="bookingForm.controls.phone"
      />
    </div>

    <app-booking-summary
      class="lg:sticky lg:top-24"
      [bookingFormValue]="bookingFormValue()"
      [isFormValid]="bookingForm.valid"
      [isSubmitting]="isSubmitting()"
      [confirmedBooking]="confirmedBooking()"
      [bookingNotice]="bookingNotice()"
      (retry)="confirm()"
    />
  </form>
</div>
