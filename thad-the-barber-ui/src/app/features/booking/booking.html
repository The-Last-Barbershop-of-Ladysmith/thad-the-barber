<app-backdrop mode="still" [still]="5" />

<div class="page">
  <header class="stack gap-2">
    <span class="eyebrow">Book an appointment</span>
    <h1 class="section-title">Schedule your cut</h1>
  </header>

  <div class="layout lg:grid-cols-[minmax(0,1fr)_minmax(0,24rem)]">
    <div class="stack gap-8">
      @if (availabilityNotice(); as notice) {
        <app-notice-message
          [notice]="notice"
          [phone]="phone()"
          [bookingUrl]="bookingUrl()"
          (retry)="reloadMonth()"
        />
      }
      <app-date-step
        [value]="selectedDay()"
        [minDate]="window()?.min ?? null"
        [maxDate]="window()?.max ?? null"
        [disabledDates]="disabledDates()"
        [month]="visibleMonthStart()"
        [isLoading]="isLoadingDates()"
        (dateSelect)="onDateSelect($event)"
        (monthChange)="onMonthChange($event)"
      />
      <app-time-step
        [slots]="slots()"
        [selected]="selectedStartAt()"
        [day]="selectedDay()"
        (timeSelect)="onTimeSelect($event)"
      />
      <app-details-step [form]="form" />
    </div>

    <app-booking-summary
      class="lg:sticky lg:top-24"
      [rows]="summaryRows()"
      [submitting]="isSubmitting()"
      [booked]="isBooked()"
      [hint]="hint()"
      [notice]="bookingNotice()"
      [confirmation]="confirmationText()"
      [isBotCheckFailed]="isBotCheckFailed()"
      [phone]="phone()"
      [bookingUrl]="bookingUrl()"
      (confirm)="confirm()"
    />
  </div>
</div>
