<section class="stack gap-3">
  <div class="grid gap-2.5 sm:grid-cols-2">
    <div class="stack gap-1.5">
      <label class="field-label" for="booking-name">Name</label>
      <input
        id="booking-name"
        pInputText
        [formControl]="nameControl()"
        placeholder="First & last name"
        autocomplete="name"
        [fluid]="true"
      />
    </div>
    <app-phone-field inputId="booking-phone" [phoneControl]="phoneControl()" />
  </div>
  <p class="small-print">
    Your name and phone go to the shop's Square account to book this appointment.
    <a
      class="inline-link external-link"
      routerLink="/privacy"
      target="_blank"
      data-testid="details-privacy"
      >Privacy policy<span class="sr-only"> (opens in a new tab)</span></a
    >
  </p>
</section>
