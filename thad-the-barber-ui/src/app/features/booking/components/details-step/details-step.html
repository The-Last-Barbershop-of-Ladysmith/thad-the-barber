<section class="stack gap-3">
  <p class="small-print" data-testid="details-required-note">
    <span class="required-mark" aria-hidden="true">*</span> marks a required field.
  </p>
  <div class="grid gap-2.5 sm:grid-cols-2">
    <div class="stack gap-1.5">
      <label class="field-label" for="booking-name"
        >Name<span class="required-mark" aria-hidden="true">*</span></label
      >
      <input
        id="booking-name"
        pInputText
        aria-required="true"
        [attr.aria-invalid]="isNameErrorShown() ? 'true' : null"
        [attr.aria-describedby]="isNameErrorShown() ? 'booking-name-error' : null"
        [formControl]="nameControl()"
        placeholder="First & last name"
        autocomplete="name"
        [fluid]="true"
      />
      @if (isNameErrorShown()) {
        <app-field-error errorId="booking-name-error" text="Enter your first and last name." />
      }
    </div>
    <app-phone-field
      inputId="booking-phone"
      [isRequiredMarked]="true"
      [phoneControl]="phoneControl()"
    />
  </div>
  <div class="stack gap-1.5 my-4">
    <div class="consent-row">
      <p-checkbox
        inputId="booking-text-consent"
        data-testid="text-consent"
        [binary]="true"
        [formControl]="consentControl()"
      />
      <label class="consent-label" for="booking-text-consent">
        <span>Text me to confirm this appointment and send a reminder (optional).</span>
        <span class="small-print"
          >Message and data rates may apply. Reply STOP to opt out, HELP for help. Not needed to
          book.</span
        >
      </label>
    </div>
    <div class="consent-row">
      <p-checkbox
        inputId="booking-marketing-consent"
        data-testid="marketing-consent"
        [binary]="true"
        [formControl]="marketingConsentControl()"
      />
      <label class="consent-label" for="booking-marketing-consent">
        <span>Also text me shop news, like openings, closures and offers (optional).</span>
        <span class="small-print"
          >Up to 4 a month. Message and data rates may apply. Reply STOP to opt out, HELP for help.
          Not needed to book.</span
        >
      </label>
    </div>
  </div>
  <p class="small-print">
    Your name and phone go to the shop's Square account to book this appointment. By booking you agree to the
    <a
      class="inline-link external-link"
      routerLink="/terms"
      target="_blank"
      data-testid="details-terms"
      >Terms and conditions<span class="sr-only"> (opens in a new tab)</span></a
    >
    and the
    <a
      class="inline-link external-link"
      routerLink="/privacy"
      target="_blank"
      data-testid="details-privacy"
      >Privacy policy<span class="sr-only"> (opens in a new tab)</span></a
    >.
  </p>
</section>
