<section class="stack gap-3">
  <div class="date-step-header">
    <span class="eyebrow">1 — Pick a date</span>
    @if (isLoading()) {
      <p-progress-spinner
        class="size-4"
        strokeWidth="6"
        ariaLabel="Loading open days"
        data-testid="dates-loading"
      />
    }
  </div>
  <p-datepicker
    [inline]="true"
    [formControl]="dateControl()"
    [minDate]="bookingWindow()?.min ?? null"
    [maxDate]="bookingWindow()?.max ?? null"
    [disabledDates]="disabledDates()"
    [defaultDate]="visibleMonthStart()"
    [showOtherMonths]="false"
    (onSelect)="onDateSelect()"
    (onMonthChange)="onMonthChange($event)"
  />
  <div class="availability-legend">
    <span class="legend-entry"><span class="legend-swatch is-available"></span>available</span>
    <span class="legend-entry"
      ><span class="legend-swatch is-unavailable"></span>closed / booked</span
    >
    <span class="legend-entry"><span class="legend-swatch is-selected"></span>selected</span>
  </div>
</section>
