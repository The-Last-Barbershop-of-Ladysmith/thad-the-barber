<section class="date-step">
  <div class="calendar-column stack gap-3">
    <div class="calendar-frame">
      @if (bookingWindow(); as bookingWindow) {
        <p-datepicker
          data-testid="date-picker"
          [pt]="{
            pcPrevButton: { root: { disabled: isFirstMonth() } },
            pcNextButton: { root: { disabled: isLastMonth() } },
          }"
          [inline]="true"
          [formControl]="dateControl()"
          dataType="string"
          dateFormat="yy-mm-dd"
          [minDate]="bookingWindow.min"
          [maxDate]="bookingWindow.max"
          [disabledDates]="closedDates()"
          [showOtherMonths]="false"
          (onMonthChange)="showMonth($event)"
        >
          <ng-template #date let-dateMeta>
            <span class="calendar-day">
              {{ dateMeta.day }}
              @if (isFillingUp(dateMeta)) {
                <span class="filling-up-dot" data-testid="filling-up"></span>
                <span class="sr-only">, filling up</span>
              }
            </span>
          </ng-template>
        </p-datepicker>
      }
      @if (isLoading()) {
        <div
          class="calendar-loading"
          data-testid="dates-loading"
          role="status"
          aria-label="Loading open days"
        >
          <p-progress-spinner class="size-10" strokeWidth="6" />
        </div>
      }
    </div>

    @if (hasNoOpenDays()) {
      <app-notice-message [notice]="noOpenDaysNotice" />
    }
  </div>
  <div class="availability-legend lg:text-base">
    <span class="legend-entry"><span class="legend-swatch is-available"></span>available</span>
    <span class="legend-entry"
      ><span class="legend-swatch is-unavailable"></span>closed / booked</span
    >
    <span class="legend-entry"><span class="legend-swatch is-selected"></span>selected</span>
    <span class="legend-entry"><span class="filling-up-dot"></span>filling up</span>
  </div>
</section>
