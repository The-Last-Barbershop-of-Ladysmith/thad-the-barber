<section class="stack gap-3">
  <div class="step-header">
    <span class="eyebrow">1 — Pick a date</span>
    @if (isLoading()) {
      <p-progress-spinner class="size-4" strokeWidth="6" ariaLabel="Loading open days" data-testid="dates-loading" />
    }
  </div>
  <p-datepicker
    [inline]="true"
    [ngModel]="value()"
    [minDate]="minDate()"
    [maxDate]="maxDate()"
    [disabledDates]="disabledDates()"
    [defaultDate]="month()"
    [showOtherMonths]="false"
    (onSelect)="dateSelect.emit($event)"
    (onMonthChange)="monthChange.emit($event)"
  />
  <div class="legend">
    <span class="legend-item"><span class="swatch open"></span>available</span>
    <span class="legend-item"><span class="swatch closed"></span>closed / booked</span>
    <span class="legend-item"><span class="swatch selected"></span>selected</span>
  </div>
</section>
