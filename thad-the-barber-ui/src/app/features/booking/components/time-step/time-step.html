<section class="stack gap-3">
  @if (selectedDateLabel(); as pickedDateLabel) {
    <span class="text-sm text-surface-200"
      >{{ pickedDateLabel }} · {{ timeSlots().length }} open</span
    >
    @if (fillingUpNote(); as fillingUp) {
      <p-message severity="warn" size="small" data-testid="filling-up-note">{{
        fillingUp
      }}</p-message>
    }
    <p-selectbutton
      data-testid="time-list"
      [formControl]="startAtControl()"
      [options]="timeSlots()"
      optionLabel="label"
      optionValue="startAt"
      [allowEmpty]="false"
    />
  } @else {
    <div class="no-day-picked">Select a day to see open times</div>
  }
</section>
