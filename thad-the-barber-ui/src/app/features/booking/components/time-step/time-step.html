<section class="stack gap-3">
  <span class="eyebrow">2 — Pick a time</span>
  @if (selectedDate(); as pickedDate) {
    <span class="text-sm text-surface-200"
      >{{ pickedDate | date: 'EEEE, MMMM d' }} · {{ timeSlots().length }} open</span
    >
    <p-selectbutton
      [formControl]="startAtControl()"
      [options]="timeSlots()"
      optionLabel="label"
      optionValue="startAt"
      [allowEmpty]="false"
    />
  } @else {
    <div class="no-day-picked">Select a day to see open times</div>
  }
</section>
