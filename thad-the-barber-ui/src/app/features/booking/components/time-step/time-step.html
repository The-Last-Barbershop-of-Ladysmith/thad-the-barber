<section class="time-step">
  @if (selectedDateLabel(); as pickedDateLabel) {
    <span class="open-count">{{ pickedDateLabel }} · {{ timeSlots().length }} open</span>
    @if (fillingUpNote(); as fillingUp) {
      <div class="filling-up-note">
        <p-message severity="warn" size="small" icon="pi pi-clock" data-testid="filling-up-note">{{
          fillingUp
        }}</p-message>
      </div>
    }
    <p-selectbutton
      data-testid="time-list"
      [formControl]="startAtControl()"
      [options]="timeSlots()"
      optionLabel="label"
      optionValue="startAt"
      [allowEmpty]="false"
    />
  } @else {
    <div class="no-day-picked">Select a day to see open times</div>
  }
</section>
