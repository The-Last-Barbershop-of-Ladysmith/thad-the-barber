<section class="stack gap-3">
  <span class="eyebrow">2 — Pick a time</span>
  @if (!day()) {
    <div class="empty">Select a day to see open times</div>
  } @else {
    <span class="text-sm text-surface-200">{{ day() | date: 'EEEE, MMMM d' }} · {{ slots().length }} open</span>
    <p-selectbutton
      [options]="slots()"
      optionLabel="label"
      optionValue="startAt"
      [allowEmpty]="false"
      [ngModel]="selected()"
      (ngModelChange)="timeSelect.emit($event)"
    />
  }
</section>
