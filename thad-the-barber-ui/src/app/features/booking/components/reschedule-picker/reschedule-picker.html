<section class="stack gap-5" data-testid="reschedule-picker" aria-labelledby="reschedule-heading">
  <h2 id="reschedule-heading" class="field-label m-0" tabindex="-1">Pick a new time</h2>

  @if (availabilityNotice(); as loadFailureNotice) {
    <app-notice-message [notice]="loadFailureNotice" (retry)="reloadDays()" />
  }
  @if (notice(); as moveNotice) {
    <app-notice-message data-testid="reschedule-notice" [notice]="moveNotice" (retry)="move()" />
  }

  <app-date-step [dateControl]="dateControl" [startAtControl]="startAtControl" />
  @if (pickedDate(); as date) {
    <app-time-step [startAtControl]="startAtControl" [selectedDate]="date" />
  }

  <div class="reschedule-actions">
    <button
      pButton
      type="button"
      data-testid="confirm-reschedule"
      [disabled]="!pickedTimeLabel() || isSaving()"
      [loading]="isSaving()"
      (click)="move()"
    >
      <span pButtonLabel>{{
        pickedTimeLabel() ? 'Move to ' + pickedTimeLabel() : 'Pick a new time'
      }}</span>
    </button>
    <button
      pButton
      type="button"
      severity="secondary"
      [outlined]="true"
      data-testid="close-reschedule"
      [disabled]="isSaving()"
      (click)="closed.emit()"
    >
      <span pButtonLabel>Keep current time</span>
    </button>
  </div>
</section>
