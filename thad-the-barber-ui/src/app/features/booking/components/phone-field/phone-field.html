<div class="stack gap-1.5">
  <label class="field-label" [for]="inputId()">Phone</label>
  <p-inputmask
    [inputId]="inputId()"
    [formControl]="phoneControl()"
    [mask]="phoneMask"
    placeholder="(555) 555-5555"
    type="tel"
    autocomplete="tel"
    [fluid]="true"
    (click)="moveCaretToFirstDigit($event)"
  />
</div>
