<app-backdrop [anchors]="backdropAnchors" />

<app-scroll-rail />

<div class="relative">
  <app-hero [id]="sections.Top" />
  <div class="below-hero">
    <app-next-times [id]="sections.OpenTimes" />
    <app-hours [id]="sections.Hours" />
    <div [id]="sections.Announcements">
      @defer (on idle) {
        <app-announcements-carousel />
      }
    </div>
    <app-gallery [id]="sections.Gallery" />
    <app-testimonials [id]="sections.Reviews" />
    <app-visit [id]="sections.Visit" />
  </div>
</div>
