<section class="hero site-gutter">
  <div class="content">
    <h1 class="display-title text-shadow-hero">
      Thad <span class="text-primary">The</span> Barber
    </h1>
    <a pButton size="large" routerLink="/book">
      Book a cut
      <i class="pi pi-arrow-right"></i>
    </a>
    @if (nextTimeSlots()[0]; as nextTimeSlot) {
      <dl class="facts">
        <div data-testid="next-open-chair">
          <dt>
            {{ nextTimeSlot.weekdayLabel }} {{ nextTimeSlot.time }}<span class="time-period"> {{ nextTimeSlot.period }}</span>
          </dt>
          <dd class="caption">Next open chair</dd>
        </div>
      </dl>
    }
  </div>
</section>
