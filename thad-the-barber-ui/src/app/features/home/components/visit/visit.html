<section class="page-section">
  <p-card class="w-full max-w-275">
    <div class="panel md:grid-cols-2">
      <div class="map">
        @if (mapUrl(); as mapUrl) {
          <iframe
            title="Map to {{ shopName() }}"
            [src]="mapUrl"
            loading="lazy"
            class="map-frame"
          ></iframe>
        }
      </div>

      <div class="details">
        <app-section-heading eyebrow="Visit us" title="Find the shop" />

        <div class="facts">
          @if (address(); as address) {
            <div class="fact ruled">
              <span class="field-label">Location</span>
              <span class="leading-snug text-surface-100"
                >{{ address.street }}<br />{{ address.city }}, {{ address.state }}
                {{ address.postalCode }}</span
              >
              <a
                pButton
                [link]="true"
                [href]="directionsUrl()"
                target="_blank"
                rel="noopener"
                class="mt-1.5 self-start"
              >
                <span pButtonLabel>Get directions</span>
                <i pButtonIcon class="pi pi-arrow-right"></i>
              </a>
            </div>
          }

          <div class="fact ruled">
            <span class="field-label">Hours</span>
            <app-hours-list variant="stacked" />
          </div>

          <div class="fact">
            <span class="field-label">Phone</span>
            <a [href]="phone().tel" class="nav-link phone">{{ phone().display }}</a>
            <span class="text-sm text-muted-color">Questions? Text this number.</span>
          </div>
        </div>
      </div>
    </div>
  </p-card>
</section>
