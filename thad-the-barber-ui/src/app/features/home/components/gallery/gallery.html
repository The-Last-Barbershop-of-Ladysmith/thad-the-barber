@if (photos().length > 0) {
  <section class="gallery site-gutter" data-testid="gallery">
    <div class="inner">
      <app-section-heading eyebrow="Lookbook" title="Fresh out the chair" />

      <ul class="prints">
        @for (photo of photos(); track photo.src; let i = $index) {
          <li class="print">
            <button
              type="button"
              class="print-button"
              [attr.aria-label]="'Open ' + photo.alt"
              (click)="open(i)"
            >
              <img
                [src]="photo.src"
                [alt]="photo.alt"
                loading="lazy"
                class="print-img"
              />
            </button>
          </li>
        }
      </ul>
    </div>
  </section>

  <p-galleria
    [value]="photos()"
    [(visible)]="lightboxOpen"
    [(activeIndex)]="activeIndex"
    [fullScreen]="true"
    [circular]="true"
    [showItemNavigators]="true"
    [showThumbnails]="false"
    [containerStyle]="{ 'max-width': 'min(80vw, 1100px)' }"
  >
    <ng-template #item let-photo>
      <div class="photo-frame">
        <div class="photo-mat">
          <img [src]="photo.src" [alt]="photo.alt" class="lightbox-img" />
        </div>
      </div>
    </ng-template>
    <ng-template #footer>
      <div class="lightbox-count">{{ activeIndex() + 1 }} / {{ photos().length }}</div>
    </ng-template>
  </p-galleria>
}
