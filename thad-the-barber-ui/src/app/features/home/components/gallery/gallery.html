@if (images().length > 0) {
  <section class="page-section" data-testid="gallery">
    <p-card class="w-full max-w-300">
      <div class="stack gap-8">
        <app-section-heading eyebrow="Gallery" title="Fresh out the chair" />

        <div class="columns-2 gap-5 md:columns-3 lg:columns-4">
          @for (image of images(); track image.id; let i = $index) {
            <button
              type="button"
              class="print"
              [attr.aria-label]="'Open ' + image.alt"
              (click)="open(i)"
            >
              <div class="photo-frame">
                <div class="photo-mat">
                  <img
                    [src]="image.src"
                    [srcset]="image.srcset"
                    sizes="(min-width: 1024px) 25vw, (min-width: 768px) 33vw, 50vw"
                    [width]="image.width"
                    [height]="image.height"
                    [alt]="image.alt"
                    loading="lazy"
                    class="print-img"
                  />
                </div>
              </div>
            </button>
          }
        </div>
      </div>
    </p-card>
  </section>

  <p-galleria
    [value]="images()"
    [(visible)]="lightboxOpen"
    [(activeIndex)]="activeIndex"
    [fullScreen]="true"
    [circular]="true"
    [showItemNavigators]="true"
    [showThumbnails]="false"
    [containerStyle]="{ 'max-width': 'min(80vw, 1100px)' }"
  >
    <ng-template #item let-image>
      <div class="photo-frame">
        <div class="photo-mat">
          <img
            [src]="image.src"
            [srcset]="image.srcset"
            sizes="min(80vw, 1100px)"
            [width]="image.width"
            [height]="image.height"
            [alt]="image.alt"
            class="lightbox-img"
          />
        </div>
      </div>
    </ng-template>
    <ng-template #footer>
      <div class="lightbox-count">{{ activeIndex() + 1 }} / {{ images().length }}</div>
    </ng-template>
  </p-galleria>
}
