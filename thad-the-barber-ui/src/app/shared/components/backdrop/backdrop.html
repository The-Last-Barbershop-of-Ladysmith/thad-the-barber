<div class="backdrop" aria-hidden="true">
  @if (mode() === 'scroll') {
    @for (src of frames; track $index) {
      <img
        [src]="src"
        alt=""
        class="frame"
        [style.opacity]="opacityAt($index)"
        [attr.fetchpriority]="$index === 0 ? 'high' : null"
        [attr.loading]="$index === 0 ? null : 'lazy'"
      />
    }
  } @else {
    <img [src]="frames[still()]" alt="" class="still" />
    <div class="wash"></div>
  }
</div>
