<p-message
  [attr.data-testid]="isProblem() ? 'booking-notice' : null"
  [severity]="notice().severity"
  [icon]="severityIcon()"
  styleClass="w-full"
>
  <div class="stack gap-2">
    @if (notice().title) {
      <strong>{{ notice().title }}</strong>
    }
    <span>{{ notice().text }}</span>
    @if (notice().link; as link) {
      <a
        class="inline-link w-fit font-semibold"
        data-testid="notice-link"
        [routerLink]="link.path"
        >{{ link.label }}</a
      >
    }
    <ng-content />
    @if (isProblem()) {
      <span>
        Still having trouble? Call
        <a class="inline-link font-semibold" data-testid="notice-call" [href]="phone().tel">{{
          phone().display
        }}</a
        >,
        <a class="inline-link font-semibold" data-testid="notice-text" [href]="phone().sms"
          >text us</a
        >, or book on
        <a
          class="inline-link external-link font-semibold"
          data-testid="notice-booking-site"
          target="_blank"
          rel="noopener"
          [href]="bookingUrl()"
          >our Square booking page<span class="sr-only"> (opens in a new tab)</span></a
        >.
      </span>
    }
    @if (notice().canRetry) {
      <button
        pButton
        type="button"
        size="small"
        class="w-fit"
        [severity]="noticeSeverityToButtonSeverity()"
        data-testid="notice-retry"
        (click)="retry.emit()"
      >
        Try again
      </button>
    }
  </div>
</p-message>
