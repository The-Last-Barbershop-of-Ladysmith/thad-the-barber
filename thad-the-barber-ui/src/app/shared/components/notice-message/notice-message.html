<p-message
  [attr.data-testid]="isProblem() ? 'booking-notice' : null"
  [severity]="notice().severity"
  [icon]="severityIcon()"
  styleClass="w-full"
>
  <div class="stack gap-2">
    @if (notice().title) {
      <strong>{{ notice().title }}</strong>
    }
    <span>{{ notice().text }}</span>
    @if (isProblem()) {
      <span>
        Still having trouble? Call
        <a class="notice-link" data-testid="notice-call" [href]="phone().tel">{{
          phone().display
        }}</a
        >, <a class="notice-link" data-testid="notice-text" [href]="phone().sms">text us</a>, or
        book on
        <a
          class="notice-link"
          data-testid="notice-booking-site"
          target="_blank"
          rel="noopener"
          [href]="bookingUrl()"
          >our Square booking page</a
        >.
      </span>
    }
    @if (notice().canRetry) {
      <button
        pButton
        type="button"
        size="small"
        class="w-fit"
        [severity]="noticeSeverityToButtonSeverity()"
        data-testid="notice-retry"
        (click)="retry.emit()"
      >
        <span pButtonLabel>Try again</span>
      </button>
    }
  </div>
</p-message>
