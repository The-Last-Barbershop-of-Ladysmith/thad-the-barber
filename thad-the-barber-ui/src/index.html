<!doctype html>
<html lang="en" class="app-dark">
<head>
  <meta charset="utf-8">
  <title>Thad The Barber</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c0806">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="48x48">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <style nonce="CSP_NONCE">
    #startup-loader {
      position: fixed;
      inset: 0;
      z-index: 2147483000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      background: #0c0806;
      color: #f4e6d8;
      font-family: system-ui, sans-serif;
      transition: opacity 0.3s, visibility 0.3s;
    }
    /* Prerendered pages and the rendered app fill <app-root>, so the loader only shows over an empty one. */
    app-root:not(:empty) ~ #startup-loader {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    #startup-loader .logo {
      width: 10rem;
      height: auto;
    }
    #startup-loader .spinner {
      width: 2rem;
      height: 2rem;
      border: 0.25rem solid #4a3a2d;
      border-top-color: #e8904a;
      border-radius: 50%;
      animation: startup-spin 0.9s linear infinite;
    }
    #startup-loader .failed,
    #startup-loader[data-failed] .spinner {
      display: none;
    }
    #startup-loader[data-failed] .loading {
      display: none;
    }
    #startup-loader[data-failed] .failed {
      display: block;
    }
    .startup-loader-text {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
    }
    @keyframes startup-spin {
      to {
        transform: rotate(360deg);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      #startup-loader .spinner {
        animation: none;
        display: none;
      }
    }
  </style>
  <noscript>
    <style nonce="CSP_NONCE">
      #startup-loader {
        display: none;
      }
    </style>
  </noscript>
</head>
<body>
  <app-root ngCspNonce="CSP_NONCE"></app-root>
  <div id="startup-loader" role="status">
    <img class="logo" src="/assets/logo.png" alt="">
    <div class="spinner" aria-hidden="true"></div>
    <span class="startup-loader-text loading">Loading</span>
    <p class="failed">Something went wrong. Please refresh.</p>
  </div>
</body>
</html>
